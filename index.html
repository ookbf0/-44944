<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>亚洲风提示词构建器</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: #0d0d0f; color: #e0dcd9; font-family: 'Segoe UI', sans-serif; padding: 20px 16px; display: flex; justify-content: center; }
        .app { max-width: 1300px; width: 100%; background: #18181c; border-radius: 28px; padding: 24px 22px; border: 1px solid #2a2a30; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        h1 { font-size: 26px; font-weight: 600; background: linear-gradient(135deg, #f0c8b0, #d9a58a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block; }
        .sub { color: #888; font-size: 13px; border-bottom: 1px solid #2a2a30; padding-bottom: 12px; margin-bottom: 18px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .sub .status { background: #25252b; padding: 3px 16px; border-radius: 40px; font-size: 12px; }
        .sub .status.loading { color: #f0c8b0; }
        .sub .status.success { color: #8bc8a0; }
        .sub .status.error { color: #e88a7c; }
        .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid #2a2a30; padding-bottom: 12px; }
        .tab { background: #25252b; padding: 6px 16px; border-radius: 40px; font-size: 13px; cursor: pointer; border: 1px solid transparent; transition: 0.15s; color: #b0a8a0; }
        .tab:hover { background: #2f2f37; border-color: #4a4a54; }
        .tab.active { background: #3d2c24; border-color: #d9a58a; color: #f0e0d5; }
        .tab .count { font-size: 10px; background: #1e1e24; padding: 0 6px; border-radius: 20px; margin-left: 4px; color: #777; }
        .content { min-height: 300px; }
        .group { background: #1a1a20; border-radius: 12px; margin-bottom: 10px; border: 1px solid #28282e; overflow: hidden; }
        .group-header { background: #22222a; padding: 10px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 500; color: #cbc4bd; }
        .group-header:hover { background: #2a2a32; }
        .group-header .arrow { transition: transform 0.2s; font-size: 14px; }
        .group-header .arrow.open { transform: rotate(90deg); }
        .group-body { padding: 8px 12px 12px 12px; display: none; flex-wrap: wrap; gap: 6px; }
        .group-body.open { display: flex; }
        .opt {
            background: #25252b;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: 0.12s;
            color: #cbc4bd;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .opt .en { color: #7a7a82; font-size: 10px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .opt:hover { background: #2f2f37; border-color: #4a4a54; }
        .opt.active { background: #3d2c24; border-color: #d9a58a; color: #f0e0d5; }
        .opt.active .en { color: #c9a68e; }
        .output-section { margin-top: 24px; background: #0f0f12; border-radius: 16px; padding: 16px 18px; border: 1px solid #2a2a32; }
        .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .output-header h3 { font-weight: 400; font-size: 14px; color: #b0a8a0; }
        .actions button { background: #2d2d35; border: none; color: #ddd; padding: 5px 16px; border-radius: 30px; font-size: 12px; cursor: pointer; transition: 0.15s; margin-left: 6px; }
        .actions button:hover { background: #3f3f4a; color: #fff; }
        .actions .primary { background: #c28b6e; color: #0d0d0f; font-weight: 500; }
        .actions .primary:hover { background: #d9a58a; }
        #promptOutput { background: #09090b; padding: 14px 16px; border-radius: 10px; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.6; color: #ece6e0; white-space: pre-wrap; word-break: break-word; min-height: 60px; border: 1px solid #202026; max-height: 300px; overflow-y: auto; }
        #promptOutput.placeholder { color: #4a4a52; font-style: italic; }
        .translation-box { margin-top: 10px; background: #131317; padding: 10px 14px; border-radius: 10px; font-size: 12px; color: #9a928a; border-left: 3px solid #3a3a44; max-height: 120px; overflow-y: auto; }
        .translation-box strong { color: #cbc4bd; font-weight: 500; }
        .footer-note { margin-top: 14px; font-size: 11px; color: #4a4a52; text-align: center; }
        .reset-btn { background: transparent; border: 1px solid #333; color: #888; padding: 3px 12px; border-radius: 30px; cursor: pointer; font-size: 11px; }
        .reset-btn:hover { border-color: #555; color: #ccc; }
        .empty-tip { color: #555; text-align: center; padding: 40px 0; font-size: 15px; }
        .error-box { background: #2a1a1a; border: 1px solid #6a3a3a; border-radius: 12px; padding: 16px 20px; margin: 10px 0; color: #e8b0a0; font-size: 13px; }
        .debug-box { background: #1a1a22; border: 1px dashed #444; border-radius: 8px; padding: 12px; margin: 10px 0; font-size: 12px; color: #aaa; max-height: 200px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; }
    </style>
</head>
<body>

<div class="app">
    <h1>⛩️ 亚洲风 · 提示词构建器</h1>
    <div class="sub">
        <span>数据源：ShuaiHui/nsfw-prompt-templates-asian</span>
        <span class="status" id="status">加载中...</span>
    </div>

    <div class="tabs" id="tabsContainer"></div>
    <div id="errorContainer"></div>
    <div id="debugContainer"></div>
    <div class="content" id="contentContainer">
        <div class="empty-tip">⏳ 正在从原始仓库加载数据...</div>
    </div>

    <div class="output-section">
        <div class="output-header">
            <h3>📋 生成的提示词</h3>
            <div class="actions">
                <button class="reset-btn" onclick="resetSelections()">清空</button>
                <button class="primary" onclick="copyPrompt()">📄 复制</button>
            </div>
        </div>
        <div id="promptOutput" class="placeholder">选择词条后自动生成...</div>
        <div class="translation-box">
            <strong>中文释义：</strong> <span id="translationText">暂无选择</span>
        </div>
    </div>
    <div class="footer-note">* 点击标签切换分类 · 点击分组展开/收起 · 点击词条复选</div>
</div>

<script>
    // ============================================================
    // ⚠️ 重要：把下面的地址换成你自己的 Worker 域名
    // ============================================================
    const WORKER_URL = 'https://44944.pages.dev/';

    const FILES = [
        '00-范例.md', '01-场景主题.md', '02-景别构图.md',
        '03-裸露液体.md', '04-服装专项.md', '05-光影氛围.md',
        '06-姿势动作.md', '07-表情眼神.md', '08-风格胶片.md',
        '09-妆容专项.md', '10-发型饰品.md', '11-瑕疵细节.md',
        '12-纹身标记.md', '13-道具宠物.md', '14-人格卡片.md'
    ];
    const FILE_LABELS = {
        '00-范例.md':'00 范例', '01-场景主题.md':'01 场景', '02-景别构图.md':'02 景别',
        '03-裸露液体.md':'03 裸露', '04-服装专项.md':'04 服装', '05-光影氛围.md':'05 光影',
        '06-姿势动作.md':'06 姿势', '07-表情眼神.md':'07 表情', '08-风格胶片.md':'08 风格',
        '09-妆容专项.md':'09 妆容', '10-发型饰品.md':'10 发型', '11-瑕疵细节.md':'11 瑕疵',
        '12-纹身标记.md':'12 纹身', '13-道具宠物.md':'13 道具', '14-人格卡片.md':'14 人格'
    };

    let allData = {};
    let selections = {};
    let currentFile = FILES[0];
    let firstOpenDone = false;

    // ---------- 解析器 ----------
    function extractEnZh(line) {
        var raw = line.trim();
        if (!raw) return null;

        var match = raw.match(/^(.*?)\s*[（(]([^）)]*)[）)]\s*$/);
        if (match && (match[1].trim() || match[2].trim())) {
            return { en: match[1].trim(), zh: match[2].trim() };
        }

        match = raw.match(/^(.*?)\s{2,}([\u4e00-\u9fff].*)$/);
        if (match) {
            return { en: match[1].trim(), zh: match[2].trim() };
        }

        var cnChars = raw.match(/[\u4e00-\u9fff]+/g);
        if (cnChars) {
            var zh = cnChars.join(' ');
            var en = raw.replace(/[\u4e00-\u9fff]+/g, '').trim();
            if (en.replace(/[^\w\s,.]/g, '').trim() === '') en = '';
            return { en: en, zh: zh };
        }

        return { en: raw, zh: '' };
    }

    function parseMd(text) {
        var lines = text.split(/\r?\n/);
        var groups = [];
        var currentGroup = { name: '全部词条', items: [] };
        var pendingItems = [];

        for (var i = 0; i < lines.length; i++) {
            var trimmed = lines[i].trim();
            if (!trimmed) continue;

            if (/^##\s+/.test(trimmed)) {
                if (pendingItems.length > 0) {
                    currentGroup.items = pendingItems.slice();
                    groups.push(currentGroup);
                    pendingItems = [];
                } else if (currentGroup.items.length > 0) {
                    groups.push(currentGroup);
                }
                currentGroup = { name: trimmed.replace(/^##\s+/, '').trim(), items: [] };
                continue;
            }

            if (/^#{1,3}\s+/.test(trimmed)) {
                if (pendingItems.length > 0) {
                    currentGroup.items = pendingItems.slice();
                    groups.push(currentGroup);
                    pendingItems = [];
                } else if (currentGroup.items.length > 0) {
                    groups.push(currentGroup);
                }
                currentGroup = { name: '默认分组', items: [] };
                continue;
            }

            var content = null;
            if (/^\s*[-*+]\s+/.test(trimmed) || /^\s*\d+[\.\)]\s+/.test(trimmed)) {
                content = trimmed.replace(/^\s*[-*+]\s+/, '').replace(/^\s*\d+[\.\)]\s+/, '');
            } else if (trimmed.length < 120 && !/^#/.test(trimmed) && !/^---/.test(trimmed)) {
                content = trimmed;
            }

            if (content) {
                var parsed = extractEnZh(content);
                if (parsed && (parsed.en || parsed.zh)) {
                    pendingItems.push(parsed);
                }
            }
        }

        if (pendingItems.length > 0) {
            currentGroup.items = pendingItems.slice();
            groups.push(currentGroup);
        } else if (currentGroup.items.length > 0) {
            groups.push(currentGroup);
        } else if (groups.length === 0) {
            groups.push(currentGroup);
        }

        var total = 0;
        for (var g = 0; g < groups.length; g++) {
            total += groups[g].items.length;
        }
        if (total === 0) {
            var fallback = { name: '原始内容', items: [] };
            for (var j = 0; j < lines.length; j++) {
                var trimmed2 = lines[j].trim();
                if (trimmed2 && !/^#/.test(trimmed2) && !/^---/.test(trimmed2) && trimmed2.length < 120) {
                    var parsed2 = extractEnZh(trimmed2);
                    if (parsed2 && (parsed2.en || parsed2.zh)) {
                        fallback.items.push(parsed2);
                    }
                }
            }
            if (fallback.items.length > 0) {
                groups.length = 0;
                groups.push(fallback);
            }
        }

        return groups;
    }

    // ---------- 加载数据 ----------
    async function loadAllData() {
        var statusEl = document.getElementById('status');
        statusEl.textContent = '加载中...';
        statusEl.className = 'status loading';
        document.getElementById('errorContainer').innerHTML = '';
        document.getElementById('debugContainer').innerHTML = '';

        var successCount = 0;
        var errors = [];
        var debugInfo = [];

        for (var i = 0; i < FILES.length; i++) {
            var file = FILES[i];
            try {
                var url = WORKER_URL + '?file=' + encodeURIComponent(file);
                debugInfo.push('请求: ' + url);
                var resp = await fetch(url);

                if (resp.ok) {
                    var text = await resp.text();
                    debugInfo.push(file + ': 获取成功 (' + text.length + ' 字符)');

                    var groups = parseMd(text);
                    var total = 0;
                    for (var g = 0; g < groups.length; g++) {
                        total += groups[g].items.length;
                    }
                    debugInfo.push(file + ': 解析出 ' + total + ' 个词条，' + groups.length + ' 个分组');

                    allData[file] = groups;
                    successCount++;
                } else {
                    errors.push(file + ': HTTP ' + resp.status);
                    debugInfo.push(file + ': HTTP ' + resp.status);
                    allData[file] = [{ name: '加载失败', items: [] }];
                }
            } catch (e) {
                errors.push(file + ': ' + e.message);
                debugInfo.push(file + ': 错误 - ' + e.message);
                allData[file] = [{ name: '加载失败', items: [] }];
            }
        }

        document.getElementById('debugContainer').innerHTML =
            '<div class="debug-box">' + debugInfo.join('\n') + '</div>';

        if (successCount === FILES.length) {
            statusEl.textContent = '✅ 已加载 ' + successCount + ' 个文件';
            statusEl.className = 'status success';
        } else {
            statusEl.textContent = '⚠️ 加载 ' + successCount + '/' + FILES.length;
            statusEl.className = 'status error';
            if (errors.length > 0) {
                document.getElementById('errorContainer').innerHTML =
                    '<div class="error-box"><strong>❌ 加载失败的文件：</strong><br/>' +
                    errors.map(function(e) { return '• ' + e; }).join('<br/>') +
                    '</div>';
            }
        }

        currentFile = FILES[0];
        renderTabs();
        renderContent(currentFile);
        updateOutput();
    }

    // ---------- 渲染 ----------
    function renderTabs() {
        var container = document.getElementById('tabsContainer');
        container.innerHTML = '';
        for (var i = 0; i < FILES.length; i++) {
            var file = FILES[i];
            var tab = document.createElement('span');
            tab.className = 'tab' + (file === currentFile ? ' active' : '');
            var groups = allData[file] || [];
            var count = 0;
            for (var g = 0; g < groups.length; g++) {
                count += (groups[g].items ? groups[g].items.length : 0);
            }
            var label = FILE_LABELS[file] || file;
            tab.innerHTML = label + ' <span class="count">' + count + '</span>';
            tab.dataset.file = file;
            tab.addEventListener('click', function(f) {
                return function() {
                    currentFile = f;
                    renderTabs();
                    renderContent(f);
                    updateOutput();
                };
            }(file));
            container.appendChild(tab);
        }
    }

    function renderContent(file) {
        var container = document.getElementById('contentContainer');
        var groups = allData[file];
        if (!groups || groups.length === 0) {
            var hasItems = false;
            for (var g = 0; g < groups.length; g++) {
                if (groups[g].items && groups[g].items.length > 0) hasItems = true;
            }
            if (!hasItems) {
                container.innerHTML = '<div class="empty-tip">该分类暂无数据</div>';
                return;
            }
        }

        var html = '';
        firstOpenDone = false;
        for (var gi = 0; gi < groups.length; gi++) {
            var group = groups[gi];
            var groupId = 'group_' + file + '_' + gi;
            var isOpen = (gi === 0);
            if (gi === 0) firstOpenDone = true;
            var items = group.items || [];

            var itemHtml = '';
            if (items.length === 0) {
                itemHtml = '<span style="color:#555;font-size:12px;padding:4px 0;">（无词条）</span>';
            } else {
                var itemParts = [];
                for (var ii = 0; ii < items.length; ii++) {
                    var item = items[ii];
                    var key = file + '_' + gi + '_' + ii;
                    var active = selections[key] ? 'active' : '';
                    var enDisplay = item.en || '';
                    var zhDisplay = item.zh || '';
                    var label = '';
                    if (zhDisplay && enDisplay) {
                        var shortEn = enDisplay.length > 35 ? enDisplay.slice(0, 35) + '…' : enDisplay;
                        label = zhDisplay + ' (' + shortEn + ')';
                    } else if (zhDisplay) {
                        label = zhDisplay;
                    } else {
                        label = enDisplay;
                    }
                    itemParts.push(
                        '<span class="opt ' + active + '" data-key="' + key + '" data-en="' + enDisplay + '" data-zh="' + zhDisplay + '">' + label + '</span>'
                    );
                }
                itemHtml = itemParts.join('');
            }

            html +=
                '<div class="group" data-group-id="' + groupId + '">' +
                '<div class="group-header" data-target="' + groupId + '">' +
                '<span>' + (group.name || '未命名分组') + ' (' + items.length + ')</span>' +
                '<span class="arrow' + (isOpen ? ' open' : '') + '">▶</span>' +
                '</div>' +
                '<div class="group-body' + (isOpen ? ' open' : '') + '" id="' + groupId + '">' +
                itemHtml +
                '</div>' +
                '</div>';
        }

        container.innerHTML = html;

        // 折叠事件
        var headers = container.querySelectorAll('.group-header');
        for (var h = 0; h < headers.length; h++) {
            (function(header) {
                header.addEventListener('click', function() {
                    var targetId = this.dataset.target;
                    var body = document.getElementById(targetId);
                    if (body) {
                        body.classList.toggle('open');
                        var arrow = this.querySelector('.arrow');
                        if (arrow) arrow.classList.toggle('open');
                    }
                });
            })(headers[h]);
        }

        // 词条点击
        var opts = container.querySelectorAll('.opt');
        for (var o = 0; o < opts.length; o++) {
            (function(opt) {
                opt.addEventListener('click', function() {
                    var key = this.dataset.key;
                    selections[key] = !selections[key];
                    this.classList.toggle('active');
                    updateOutput();
                });
            })(opts[o]);
        }
    }

    // ---------- 输出 ----------
    function updateOutput() {
        var output = document.getElementById('promptOutput');
        var trans = document.getElementById('translationText');

        var selectedItems = [];
        for (var f = 0; f < FILES.length; f++) {
            var file = FILES[f];
            var groups = allData[file] || [];
            for (var g = 0; g < groups.length; g++) {
                var items = groups[g].items || [];
                for (var i = 0; i < items.length; i++) {
                    var key = file + '_' + g + '_' + i;
                    if (selections[key]) {
                        var enText = items[i].en || items[i].zh || '';
                        if (enText) {
                            selectedItems.push({ en: enText, zh: items[i].zh || items[i].en || '' });
                        }
                    }
                }
            }
        }

        var enParts = [];
        var zhParts = [];
        for (var s = 0; s < selectedItems.length; s++) {
            enParts.push(selectedItems[s].en);
            zhParts.push(selectedItems[s].zh);
        }

        if (enParts.length > 0) {
            output.textContent = enParts.join(', ');
            output.classList.remove('placeholder');
        } else {
            output.textContent = '请选择词条...';
            output.classList.add('placeholder');
        }
        trans.textContent = zhParts.length > 0 ? zhParts.join('；') : '暂无选择';
    }

    function resetSelections() {
        selections = {};
        renderContent(currentFile);
        updateOutput();
    }

    function copyPrompt() {
        var output = document.getElementById('promptOutput');
        var text = output.textContent;
        if (!text || text === '请选择词条...' || text === '选择词条后自动生成...') {
            alert('还没有选择任何词条！');
            return;
        }
        navigator.clipboard.writeText(text).then(function() {
            alert('✅ 已复制到剪贴板！');
        }).catch(function() {
            var range = document.createRange();
            range.selectNode(output);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            alert('✅ 已复制！');
        });
    }

    // 启动
    loadAllData();

    window.resetSelections = resetSelections;
    window.copyPrompt = copyPrompt;
</script>
</body>
</html>
